plugins {
    id 'com.android.application'
}

android {
    namespace 'qa.mubarak.caralert'
    compileSdk 34

    defaultConfig {
        applicationId 'qa.mubarak.caralert'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '2.2'
        if (!project.hasProperty('allAbis')) ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // مفتاح التوقيع يُقرأ من app/keystore.properties (غير مرفوع على GitHub)
    def ksFile = file('keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ترجمة على الجهاز بدون إنترنت (احتياطي)
    implementation 'com.google.mlkit:translate:17.0.3'
}
